name: Replay all nonlinear completion grids
on: workflow_dispatch
permissions:
  contents: read
env:
  OPENBLAS_NUM_THREADS: '1'
  OMP_NUM_THREADS: '1'
jobs:
  completion:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r experiments/harmonic-completion/requirements.txt
      - name: Repeat all 72 grids within the recorded 60-minute allocation
        working-directory: experiments/harmonic-completion
        run: |
          python -W error run.py --output /tmp/completion-replay --workers 4
          python verify.py --repeat /tmp/completion-replay --output /tmp/completion-verification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-completion-replay
          path: |
            /tmp/completion-replay/run.json
            /tmp/completion-replay/failure.json
            /tmp/completion-verification.json
