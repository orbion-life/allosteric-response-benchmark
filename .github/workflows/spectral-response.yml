name: Spectral response circuit and confidence checks
on:
  push:
    paths:
      - 'experiments/spectral-response-2026-09-14/**'
      - '.github/workflows/spectral-response.yml'
  pull_request:
    paths:
      - 'experiments/spectral-response-2026-09-14/**'
      - '.github/workflows/spectral-response.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-semantics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    defaults:
      run:
        working-directory: experiments/spectral-response-2026-09-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: experiments/spectral-response-2026-09-14/requirements-ci.txt
      - run: python -m pip install -r requirements-ci.txt
      - name: Spectral preparation, Grover semantics and adaptive confidence
        run: python -B ci_smoke.py
